name: app

# Builds the public app (`swift build`, no signing, no bundle) so a change
# that does not compile fails here, not on a user's Mac. It verifies; it does
# not publish — releases are cut locally (see checks.yml).
#
# The check itself lives in scripts/check.sh (`app`), the same one the
# pre-push hook runs. Runs only when the app or this workflow changes.
#
# Runner: `xcode-27` (macOS 27, Xcode 27.2, macOS 27.2 SDK) because the app
# is developed against that SDK and no macOS 26 image has it. The label is
# still a preview image: if runs queue for long, or the label changes, check
# the runner-images README for the current Xcode 27 label.

on:
  pull_request:
    branches: [development]
    paths:
      - 'app/**'
      - 'scripts/check.sh'
      - '.github/workflows/app.yml'
  push:
    branches: [development, main]
    paths:
      - 'app/**'
      - 'scripts/check.sh'
      - '.github/workflows/app.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # the image's default is Xcode 27.1 (macOS 27.0 SDK); select 27.2 explicitly
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 — pinned to a commit: a tag can be moved, a commit cannot

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build the app
        run: scripts/check.sh app
