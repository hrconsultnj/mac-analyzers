# Labels by area, for actions/labeler (.github/workflows/labeler.yml).
# Labels expected to exist: memory, storage, system, app-ui, engine, docs, ci
memory:
  - changed-files:
      - any-glob-to-any-file: ['memory/**']
storage:
  - changed-files:
      - any-glob-to-any-file: ['storage/**']
system:
  - changed-files:
      - any-glob-to-any-file: ['network/**', 'lib/**', 'extras/**', '*.command']
app-ui:
  - changed-files:
      - any-glob-to-any-file: ['app/**']
engine:
  - changed-files:
      - any-glob-to-any-file: ['memory/**', 'storage/**', 'network/**', 'lib/**', 'tests/**']
docs:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'examples/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'scripts/**']
